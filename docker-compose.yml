# Compose project name, so containers, networks, volumes and images are
# called gitforge-* rather than being named after whatever directory this
# happens to be checked out into.
name: gitforge

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitforge
      POSTGRES_USER: gitforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitforge_dev}
    # Host port 5433 avoids colliding with a natively installed PostgreSQL,
    # which commonly occupies 5432.
    ports:
      - "5433:5432"
    volumes:
      - gitforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitforge -d gitforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      # Root context: the server module depends on the engine module, which a
      # context of ./server could not reach.
      context: .
      dockerfile: server/Dockerfile
    container_name: gitforge-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/gitforge
      DATABASE_USER: gitforge
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-gitforge_dev}
      JWT_SECRET: ${JWT_SECRET}
      # Only the Vite dev server needs this. Through nginx the browser makes
      # same-origin requests and no preflight happens at all; set it explicitly
      # when the frontend is deployed somewhere other than beside the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      VCS_STORAGE_ROOT: /var/lib/gitforge/storage
    ports:
      # Published for development and for the test suite. The production path
      # goes through nginx; nothing external needs this port.
      - "8080:8080"
    volumes:
      # Repository objects and refs: durable data, not part of the image.
      - gitforge-storage:/var/lib/gitforge/storage
    healthcheck:
      # Readiness, not liveness: this endpoint answers UP only once the database
      # and the storage volume are both usable, so the frontend below waits for
      # a server that can actually serve.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The JVM needs a moment; failures before this do not count against it.
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Relative on purpose: nginx proxies /api to the server, so the browser
        # makes same-origin requests and the bundle is not tied to a hostname.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: gitforge-frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  gitforge-pgdata:
  gitforge-storage:
