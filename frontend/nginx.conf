server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is worth advertising the server version for.
    server_tokens off;

    # Compressible types only: the hashed assets are text, the images are not.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API shares this origin, which is the point of proxying it rather than
    # sending the browser to the server's own port. Same origin means no CORS
    # preflights, no allowed-origin list to keep in step with the deployment,
    # and a connect-src of nothing but 'self'.
    location /api/ {
        proxy_pass http://server:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large enough for the 16 MB the API itself accepts; the server does the
        # actual refusing, and it should be the one that reports it.
        client_max_body_size 20m;

        proxy_read_timeout 60s;
    }

    # Hashed filenames, so a cached copy can never be the wrong one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route. index.html must not be cached, or
    # a returning visitor loads an old document pointing at assets that are gone.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # Delivered as real headers rather than the meta tag a static build can
        # manage on its own. frame-ancestors only works this way - a meta CSP
        # ignores it - so clickjacking is refused here rather than merely
        # documented.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
