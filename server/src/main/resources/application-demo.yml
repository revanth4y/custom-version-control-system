# Development-only profile: builds the demonstration dataset.
#
# Activate with SPRING_PROFILES_ACTIVE=demo. On its own that changes nothing;
# the reset below is what does the work, and it is destructive.
gitforge:
  demo:
    # Wipes every account, repository, issue, comment and stored object, then
    # rebuilds the canonical dataset. Off by default so that running with this
    # profile is not by itself dangerous.
    reset: ${DEMO_RESET:false}

    # Every seeded account gets this password. Published on purpose: these
    # accounts exist to be signed into while showing the application, and this
    # profile cannot run against a real deployment.
    password: ${DEMO_PASSWORD:gitforge-demo-2026}

    # Unset means "now", so the contribution calendar shows recent activity.
    # Pin it to an ISO instant - 2026-01-01T00:00:00Z - and the dataset is
    # reproducible byte for byte, object ids included.
    epoch: ${DEMO_EPOCH:}
