spring:
  application:
    name: gitforge-server

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/gitforge}
    username: ${DATABASE_USER:gitforge}
    password: ${DATABASE_PASSWORD:gitforge_dev}

  jpa:
    # Flyway owns the schema; Hibernate may only verify it matches the entities.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

gitforge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Must be supplied via environment. Startup fails fast if absent or too short.
    secret: ${JWT_SECRET:}
    expiry: ${JWT_EXPIRY:PT1H}
    issuer: gitforge

logging:
  level:
    org.springframework.jdbc.core: info
